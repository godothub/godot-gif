name: Build and Release Godot-GIF

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release, for example v1.0.1.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: godot-gif-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release version and commit
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
      asset: ${{ steps.meta.outputs.asset }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release metadata
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Enter a tag starting with v, using letters, digits, dots, underscores or hyphens."
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          else
            commit="$(git rev-parse HEAD)"
          fi
          {
            echo "tag=$RELEASE_TAG"
            echo "commit=$commit"
            echo "asset=godot-gif-$RELEASE_TAG.zip"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target.platform }} / ${{ matrix.target.arch }} / ${{ matrix.target-type }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        target:
          - { platform: linux, arch: x86_64, os: ubuntu-22.04 }
          - { platform: linux, arch: x86_32, os: ubuntu-22.04 }
          - { platform: linux, arch: arm64, os: ubuntu-22.04-arm }
          - { platform: linux, arch: arm32, os: ubuntu-22.04-arm }
          - { platform: windows, arch: x86_64, os: windows-latest }
          - { platform: windows, arch: x86_32, os: windows-latest }
          - { platform: windows, arch: arm64, os: windows-latest }
          - { platform: macos, arch: universal, os: macos-latest }
          - { platform: android, arch: x86_64, os: ubuntu-22.04 }
          - { platform: android, arch: x86_32, os: ubuntu-22.04 }
          - { platform: android, arch: arm64, os: ubuntu-22.04 }
          - { platform: android, arch: arm32, os: ubuntu-22.04 }
          - { platform: ios, arch: arm64, os: macos-latest }
          - { platform: web, arch: wasm32, os: ubuntu-22.04 }
        target-type: [template_debug, template_release]

    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          submodules: recursive
          persist-credentials: false

      - name: Build Godot-GIF
        uses: ./.github/actions/build-extension
        with:
          platform: ${{ matrix.target.platform }}
          arch: ${{ matrix.target.arch }}
          target: ${{ matrix.target-type }}

      - name: Stage target library
        env:
          BUILD_PLATFORM: ${{ matrix.target.platform }}
          BUILD_ARCH: ${{ matrix.target.arch }}
          BUILD_TARGET: ${{ matrix.target-type }}
        run: python scripts/package_addon.py stage artifact "$BUILD_PLATFORM" "$BUILD_ARCH" "$BUILD_TARGET"
        shell: bash

      - name: Upload target library
        uses: actions/upload-artifact@v4
        with:
          name: godot-gif-build-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}
          if-no-files-found: error
          overwrite: true
          path: artifact/

  package:
    name: Verify and package the add-on
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          submodules: recursive
          persist-credentials: false

      - name: Download target libraries
        uses: actions/download-artifact@v4
        with:
          pattern: godot-gif-build-*
          merge-multiple: true
          path: artifact/

      - name: Verify libraries and assemble the add-on
        run: python3 scripts/package_addon.py assemble artifact

      - name: Create and verify release archive
        env:
          ASSET: ${{ needs.prepare.outputs.asset }}
        run: python3 scripts/package_addon.py archive artifact "release/$ASSET"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: godot-gif-release
          if-no-files-found: error
          overwrite: true
          path: release/${{ needs.prepare.outputs.asset }}

  release:
    name: Publish GitHub Release
    needs: [prepare, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified release archive
        uses: actions/download-artifact@v4
        with:
          name: godot-gif-release
          path: release/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          ASSET: ${{ needs.prepare.outputs.asset }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            actual_commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
            if [ "$actual_commit" != "$COMMIT" ]; then
              echo "::error::The release tag moved while the build was running."
              exit 1
            fi
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "release/$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            args=("$TAG" "release/$ASSET" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --generate-notes)
            if [[ "$TAG" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi
